	<!DOCTYPE html>
	<html>
	<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>SAP Fiori POC</title>

	<!-- SAP Font 72 -->
	<link
		rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=72&display=swap">

	<style>
		@import url("https://ui5.sap.com/sdk/resources/sap/ui/core/themes/sap_fiori_3/fonts/72-Regular.woff2");

		* {
		font-family: '72', 'SAP-icons', Arial, sans-serif !important;
		}

		.sapMMessageStrip {
		border-radius: 0.5rem;
		margin: 0.5rem 1rem;
		}
	</style>

	<script
		id="sap-ui-bootstrap"
		src="https://openui5.hana.ondemand.com/1.108.0/resources/sap-ui-core.js"
		data-sap-ui-theme="sap_fiori_3"
		data-sap-ui-resourceroots='{"com.poc.fiori": "./"}'
		data-sap-ui-compatVersion="edge"
		data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
		data-sap-ui-async="true"
		data-sap-ui-frameOptions="allow">
	</script>
	</head>
	<body class="sapUiBody" id="content">
	<div
		data-sap-ui-component
		data-name="com.poc.fiori"
		data-id="container"
		data-settings='{"id":"fioriPOC"}'>
	</div>
	</body>
	</html>
